    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nisal Abhishek | Information Systems Undergraduate &amp; Aspiring Developer</title>
    <meta
      name="description"
      content="Portfolio of Nisal Abhishek, an Information Systems undergraduate at Sabaragamuwa University of Sri Lanka building web applications with React, Laravel and MySQL."

    <meta name="author" content="Nisal Abhishek" />

    <!-- Open Graph / social sharing. Replace og:image with a real 1200x630 image in /public. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Nisal Abhishek" />
    <meta property="og:title" content="Nisal Abhishek | Information Systems Undergraduate & Aspiring Developer" />

      content="Building practical digital solutions through technology: web development, databases and business systems."
    />

    <meta property="og:image" content="https://REPLACE-WITH-YOUR-DOMAIN.example/og-image.png" />

    <meta name="twitter:card" content="summary_large_image" />

    <!-- Apply saved theme before first paint to avoid a flash of the wrong theme. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>

  </head>
